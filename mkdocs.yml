site_name: Orc Bot
site_description: A development-resource orchestrator — decisions, proposals, and what two abandoned attempts taught us.
repo_url: https://github.com/GiantCroissant-Lunar/orc-bot-hub
edit_uri: ""

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search

# No explicit `nav`. docs/ is regenerated by orc-bot's promote-docs.py on every
# promotion, so a hand-maintained nav would go stale the moment an ADR is added
# and would fail `mkdocs build --strict` for listing a page that no longer
# exists. MkDocs builds the nav from the directory tree and the generated
# index.md in each section.
