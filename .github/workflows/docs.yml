name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install mkdocs-material

      # Fails the build if a promoted document still carries a local path or a
      # bare commit sha. promote-docs.py already gates this on the way out; this
      # is the second lock, on the repository that actually publishes.
      - name: Check for leaked local paths
        run: |
          if grep -rInE '[A-Za-z]:[\\/](lunar-horse|Users|tools)' docs/; then
            echo "::error::A local absolute path reached docs/. Re-promote from orc-bot."
            exit 1
          fi
          if grep -rInE '\b[0-9a-f]{40}\b' docs/; then
            echo "::error::A bare commit sha reached docs/. Re-promote from orc-bot."
            exit 1
          fi

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
